# Render Blueprint: one Web Service serves both the game server (WebSocket) and the static client.
services:
  - type: web
    name: tidefall
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
